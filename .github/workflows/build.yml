name: Build Gulel Gang APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          if [ -f settings.gradle ]; then
            echo "DIR=." >> $GITHUB_ENV
          else
            ZIP=$(ls *.zip | head -1)
            echo "Using zip: $ZIP"
            unzip -q -o "$ZIP" -d project
            DIR=$(dirname "$(find project -name settings.gradle | head -1)")
            echo "DIR=$DIR" >> $GITHUB_ENV
          fi
