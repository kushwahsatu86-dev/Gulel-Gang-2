
name: Build Gulel Gang APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game project
        run: |
          mkdir project
          unzip -q GulelGang_APK_Project_Logo.zip -d project

      - name: Build APK
        run: gradle --no-daemon -p project :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Gulel-Gang-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
