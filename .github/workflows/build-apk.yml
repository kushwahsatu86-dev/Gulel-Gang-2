name: Build Gulel Gang APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q GulelGang_APK_Project_Logo.zip -d project
          ls -la project

      - name: Build Android APK
        run: |
          gradle --no-daemon -p project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gulel-Gang-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
